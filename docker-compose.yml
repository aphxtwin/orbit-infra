version: '3.8'

services:
  # PostgreSQL database for tenant provisioning data
  postgres:
    image: postgres:16-alpine
    container_name: provisioning-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: provisioning
    ports:
      - "5433:5432"  # Using 5433 externally to avoid conflict with local PostgreSQL
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Go application (for development)
  controller:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: provisioning-controller
    volumes:
      - .:/controller # Mount source code for hot reload
      - go_modules:/go/pkg/mod  # Cache Go modules
    env_file:
      - .env
    environment:
      # Override DB_HOST to use Docker service name
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"  # Application API port
    command: go run cmd/controller/main.go

volumes:
  postgres_data:
  go_modules:
